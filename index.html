<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SirupDosis — Kalkulator Sirup Pediatri</title>
<style>
  :root{
    --bg:#0b0f10;
    --panel:#12181a;
    --panel2:#161e20;
    --line:#223033;
    --text:#e6f1ee;
    --muted:#82a39e;
    --accent:#3ddc97;
    --accent-dim:#1f6b4f;
    --accent-dim-text:#dffaf0;
    --warn:#e0a83a;
    --danger:#e0573a;
    --shadow:0 1px 2px rgba(0,0,0,0.4);
    --mono:'SF Mono', 'Cascadia Code', Consolas, monospace;
    color-scheme:dark;
  }
  html[data-theme="light"]{
    --bg:#f6f8f7;
    --panel:#ffffff;
    --panel2:#eef3f1;
    --line:#dbe6e2;
    --text:#152420;
    --muted:#5d7671;
    --accent:#0f9d67;
    --accent-dim:#d9f3e7;
    --accent-dim-text:#0b6b47;
    --warn:#a2660a;
    --danger:#c0402a;
    --shadow:0 1px 3px rgba(20,40,35,0.08);
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  html,body{transition:background 0.15s ease,color 0.15s ease;}
  body{padding-bottom:60px;}

  header{
    padding:18px 16px 14px;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter:blur(8px);
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  }
  header h1{
    font-size:17px;
    font-weight:700;
    letter-spacing:0.2px;
    display:flex;align-items:center;gap:8px;
  }
  header h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
  header .sub{font-size:11px;color:var(--muted);margin-top:3px;font-family:var(--mono);}
  .theme-toggle{
    flex-shrink:0;
    display:flex;align-items:center;gap:2px;
    background:var(--panel2);border:1px solid var(--line);
    border-radius:999px;padding:3px;margin-top:1px;
  }
  .theme-toggle button{
    width:30px;height:26px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;line-height:1;
  }
  .theme-toggle button.active{background:var(--accent);color:#04140d;}
  html[data-theme="light"] .theme-toggle button.active{color:#f6fffb;}

  .weight-bar{
    padding:14px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky;top:57px;z-index:49;
  }
  .weight-row{display:flex;align-items:center;gap:10px;}
  .weight-row label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .weight-input-wrap{
    flex:1;display:flex;align-items:center;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:0 12px;
  }
  .weight-input-wrap input{
    flex:1;background:transparent;border:none;color:var(--text);
    font-size:20px;font-weight:700;font-family:var(--mono);
    padding:10px 6px;outline:none;width:100%;
  }
  .weight-input-wrap span{color:var(--muted);font-size:13px;font-weight:600;}
  .quickset{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;}
  .quickset button{
    flex-shrink:0;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    font-size:12px;font-family:var(--mono);font-weight:600;
    padding:6px 10px;border-radius:7px;
  }
  .quickset button.active{background:var(--accent-dim);color:var(--accent-dim-text);border-color:var(--accent);}
  .age-hint{font-size:11px;color:var(--muted);margin-top:8px;font-style:italic;}

  .tabs{
    display:flex;overflow-x:auto;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:sticky;top:139px;z-index:48;
    -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;padding:12px 14px;font-size:12.5px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;white-space:nowrap;
  }
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}

  main{padding:14px 14px 24px;}
  .panel{display:none;}
  .panel.active{display:block;}

  .drug-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:12px;
  }
  .drug-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .drug-name{font-size:15px;font-weight:700;color:var(--text);}
  .drug-brands{font-size:11px;color:var(--muted);margin-top:2px;}
  .conc-toggle{
    display:flex;gap:4px;flex-shrink:0;
  }
  .conc-toggle button{
    font-size:10.5px;font-family:var(--mono);font-weight:700;
    padding:5px 8px;border-radius:6px;
    background:var(--panel2);color:var(--muted);border:1px solid var(--line);
  }
  .conc-toggle button.active{background:var(--accent-dim);color:var(--accent-dim-text);border-color:var(--accent);}

  .dose-target{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:10px;line-height:1.5;}
  .dose-target b{color:var(--warn);}

  .result-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel2);border-radius:10px;padding:10px 12px;
    margin-bottom:6px;
  }
  .result-row.flag{border:1px solid var(--danger);}
  .result-label{font-size:11px;color:var(--muted);}
  .result-main{display:flex;align-items:baseline;gap:8px;}
  .result-cth{font-size:18px;font-weight:800;color:var(--accent);font-family:var(--mono);}
  .result-mg{font-size:11px;color:var(--muted);font-family:var(--mono);}
  .freq{font-size:10.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:3px 7px;border-radius:6px;}

  .note-strip{
    margin-top:8px;font-size:11px;color:var(--warn);
    background:rgba(224,168,58,0.08);border-left:2px solid var(--warn);
    padding:6px 9px;border-radius:0 6px 6px 0;
  }
  .note-strip.danger{color:var(--danger);background:rgba(224,87,58,0.08);border-color:var(--danger);}

  .section-label{
    font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;
    font-weight:700;margin:18px 0 10px;padding-left:2px;
  }

  .empty-state{
    text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;
  }

  footer{
    text-align:center;padding:20px 16px;font-size:10.5px;color:var(--muted);
    border-top:1px solid var(--line);margin-top:10px;font-family:var(--mono);
  }

  /* ===== Mobile-only max-width for very narrow single column (unchanged look under 900px) ===== */
  @media (min-width:600px) and (max-width:899px){
    main{max-width:640px;margin:0 auto;}
    header,.weight-bar,.tabs{padding-left:calc((100% - 640px)/2 + 16px);padding-right:calc((100% - 640px)/2 + 16px);}
  }

  /* ===== Desktop layout: sticky sidebar + scrolling content, card grid ===== */
  @media (min-width:900px){
    header{padding:16px 28px;}
    header h1{font-size:18px;}
    .layout{
      display:grid;
      grid-template-columns:296px 1fr;
      align-items:start;
      max-width:1320px;
      margin:0 auto;
    }
    .sidebar{
      position:sticky;
      top:73px;
      align-self:start;
      height:calc(100vh - 73px);
      overflow-y:auto;
      border-right:1px solid var(--line);
      padding-bottom:20px;
      scrollbar-width:thin;
    }
    .weight-bar{position:static;padding:20px 22px;}
    .tabs{
      position:static;
      display:flex;flex-direction:column;
      overflow-x:visible;
      border-bottom:none;
      padding:6px 10px 16px;
    }
    .tab{
      padding:10px 12px;border-radius:9px;border-bottom:none;
      text-align:left;
    }
    .tab.active{background:var(--accent-dim);color:var(--accent-dim-text);}

    main{
      padding:24px 28px 40px;
      max-width:none;
      margin:0;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
      gap:14px;
      align-items:start;
      align-content:start;
    }
    .section-label{grid-column:1/-1;margin-top:6px;}
    .empty-state{grid-column:1/-1;padding:80px 20px;}
    .drug-card{margin-bottom:0;}
    footer{padding:22px 28px;}
  }

  @media (min-width:1300px){
    .layout{grid-template-columns:320px 1fr;}
    main{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1><span class="dot"></span>SirupDosis</h1>
    <div class="sub">kalkulator sirup pediatri • cth & mL • Indonesia</div>
  </div>
  <div class="theme-toggle" id="themeToggle">
    <button type="button" data-theme="dark" aria-label="Mode gelap">🌙</button>
    <button type="button" data-theme="light" aria-label="Mode terang">☀️</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="weight-bar">
      <div class="weight-row">
        <label for="weightInput">BB</label>
        <div class="weight-input-wrap">
          <input type="number" id="weightInput" placeholder="0" inputmode="decimal" step="0.1">
          <span>kg</span>
        </div>
      </div>
      <div class="quickset" id="quickset"></div>
      <div class="age-hint" id="ageHint"></div>
    </div>

    <div class="tabs" id="tabs"></div>
  </aside>

  <main id="main"></main>
</div>

<footer>
  cth = 5 mL · ½ cth = 2.5 mL · ⅓ cth ≈ 1.7 mL · ¼ cth = 1.25 mL<br>
  Selalu cek konsentrasi botol aktual sebelum meresepkan.
</footer>

let currentWeight = null;
let activeTab = "analgesik";
let activeConc = {}; // drugId -> conc index

function fmtFraction(mL){
  // convert mL to cth fraction display, 1cth=5mL
  const cth = mL/5;
  if (cth <= 0) return null;
  // common fractions
  const fracs = [
    [1/4,"¼ cth"],[1/3,"⅓ cth"],[1/2,"½ cth"],[2/3,"⅔ cth"],[3/4,"¾ cth"],
    [1,"1 cth"],[1.25,"1¼ cth"],[1.5,"1½ cth"],[1.75,"1¾ cth"],[2,"2 cth"],
    [2.5,"2½ cth"],[3,"3 cth"],[3.5,"3½ cth"],[4,"4 cth"]
  ];
  let best=null,bestDiff=999;
  for(const [v,label] of fracs){
    const diff=Math.abs(v-cth);
    if(diff<bestDiff){bestDiff=diff;best=label;}
  }
  // if way off grid (very small/large), fall back to mL precision
  if(bestDiff>0.18){
    return cth.toFixed(2)+" cth";
  }
  return best;
}

function calcDrug(drug, weight){
  if(drug.skipCalc) return null;
  const conc = drug.concs[activeConc[drug.id] ?? drug.concs.findIndex(c=>c.default)];

  if(drug.fixedByAge){
    const band = drug.bands.find(b=>weight>=b.minKg && weight<b.maxKg);
    if(!band) return null;
    return {
      mL: band.mL,
      cthLabel: fmtFraction(band.mL),
      mgLow: null, mgHigh: null,
      bandText: band.text,
      conc
    };
  }

  let mgLow, mgHigh;
  if(drug.trimethoprimBasis){
    mgLow = drug.mgPerKgLowDay * weight / drug.dividedBy;
    mgHigh = mgLow;
  } else if(drug.mgPerKgLowDay !== undefined){
    mgLow = (drug.mgPerKgLowDay * weight) / drug.dividedBy;
    mgHigh = (drug.mgPerKgHighDay * weight) / drug.dividedBy;
  } else {
    mgLow = drug.mgPerKgLow * weight;
    mgHigh = drug.mgPerKgHigh * weight;
  }

  if(drug.maxSingleMg){
    mgLow = Math.min(mgLow, drug.maxSingleMg);
    mgHigh = Math.min(mgHigh, drug.maxSingleMg);
  }

  // use midpoint for the headline volume, show range in mg
  const mgMid = (mgLow+mgHigh)/2;
  const mLLow = (mgLow/conc.mgPer5)*5;
  const mLHigh = (mgHigh/conc.mgPer5)*5;
  const mLMid = (mLLow+mLHigh)/2;

  return {
    mL: mLMid,
    mLLow, mLHigh,
    cthLabel: fmtFraction(mLMid),
    mgLow, mgHigh,
    conc
  };
}

function render(){
  renderTabs();
  renderQuickset();
  renderPanel();
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  Object.entries(DB).forEach(([key,cat])=>{
    const t = document.createElement('div');
    t.className = 'tab'+(key===activeTab?' active':'');
    t.textContent = cat.label;
    t.onclick = ()=>{activeTab=key; render();};
    tabsEl.appendChild(t);
  });
}

function renderQuickset(){
  const qs = document.getElementById('quickset');
  const presets = [6,8,10,12,15,18,20,25,30];
  qs.innerHTML='';
  presets.forEach(w=>{
    const b=document.createElement('button');
    b.textContent=w+'kg';
    b.className = currentWeight===w ? 'active':'';
    b.onclick=()=>{
      currentWeight=w;
      document.getElementById('weightInput').value=w;
      render();
    };
    qs.appendChild(b);
  });
}

function renderPanel(){
  const main = document.getElementById('main');
  main.innerHTML='';

  if(currentWeight===null || currentWeight<=0){
    main.innerHTML = '<div class="empty-state">Masukkan berat badan anak di atas<br>untuk melihat dosis tiap obat.</div>';
    return;
  }

  const cat = DB[activeTab];
  cat.drugs.forEach(drug=>{
    const card = document.createElement('div');
    card.className='drug-card';

    let html = `<div class="drug-head">
      <div>
        <div class="drug-name">${drug.name}</div>
        <div class="drug-brands">${drug.brands}</div>
      </div>
    </div>`;

    if(drug.skipCalc){
      html += `<div class="note-strip">${drug.note}</div>`;
      card.innerHTML = html;
      main.appendChild(card);
      return;
    }

    // concentration toggle
    if(drug.concs.length>1){
      html += `<div class="conc-toggle" style="margin-bottom:10px;">`;
      drug.concs.forEach((c,i)=>{
        const isActive = (activeConc[drug.id] ?? drug.concs.findIndex(x=>x.default)) === i;
        html += `<button data-drug="${drug.id}" data-idx="${i}" class="${isActive?'active':''}">${c.label}</button>`;
      });
      html += `</div>`;
    }

    const result = calcDrug(drug, currentWeight);
    if(!result){
      html += `<div class="note-strip danger">Belum ada data dosis untuk berat ini.</div>`;
      card.innerHTML = html;
      main.appendChild(card);
      return;
    }

    if(drug.fixedByAge){
      html += `<div class="dose-target">Dosis tetap berbasis pita berat/usia · ${result.conc.label}</div>`;
      html += `<div class="result-row">
        <div>
          <div class="result-label">${result.bandText}</div>
        </div>
        <div class="result-main">
          <span class="result-cth">${result.cthLabel}</span>
          <span class="result-mg">${result.mL.toFixed(1)} mL</span>
        </div>
      </div>`;
      html += `<div class="freq" style="display:inline-block;margin-top:6px;">${drug.freq}</div>`;
    } else {
      const targetText = drug.trimethoprimBasis
        ? `${drug.mgPerKgLowDay} mg/kg/hari (basis TMP), dibagi ${drug.dividedBy}x`
        : drug.mgPerKgLowDay !== undefined
          ? `${drug.mgPerKgLowDay}–${drug.mgPerKgHighDay} mg/kg/hari, dibagi ${drug.dividedBy}x`
          : `${drug.mgPerKgLow}–${drug.mgPerKgHigh} mg/kg/dosis`;
      html += `<div class="dose-target">Target: <b>${targetText}</b> · ${result.conc.label}</div>`;

      const lowFlag = drug.minWeight && currentWeight < drug.minWeight;
      html += `<div class="result-row ${lowFlag?'flag':''}">
        <div>
          <div class="result-label">per dosis</div>
        </div>
        <div class="result-main">
          <span class="result-cth">${result.cthLabel}</span>
          <span class="result-mg">≈ ${result.mgLow.toFixed(0)}–${result.mgHigh.toFixed(0)} mg (${result.mLLow.toFixed(1)}–${result.mLHigh.toFixed(1)} mL)</span>
        </div>
      </div>`;
      html += `<div class="freq" style="display:inline-block;margin-top:2px;">${drug.freq}</div>`;

      if(lowFlag){
        html += `<div class="note-strip danger">BB di bawah ambang aman tipikal (${drug.minWeight}kg) — pertimbangkan ulang indikasi/dosis.</div>`;
      }
    }

    if(drug.note){
      html += `<div class="note-strip">${drug.note}</div>`;
    }

    card.innerHTML = html;
    main.appendChild(card);
  });

  // wire up concentration toggle buttons
  main.querySelectorAll('.conc-toggle button').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.drug;
      const idx = parseInt(btn.dataset.idx);
      activeConc[id]=idx;
      render();
    };
  });
}

document.getElementById('weightInput').addEventListener('input', (e)=>{
  const v = parseFloat(e.target.value);
  currentWeight = isNaN(v) ? null : v;
  renderQuickset();
  renderPanel();
});

// ===== Theme handling =====
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('#themeToggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.theme===theme);
  });
  try{ localStorage.setItem('sirupdosis-theme', theme); }catch(e){}
}

function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('sirupdosis-theme'); }catch(e){}
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(saved || (prefersLight ? 'light' : 'dark'));
}

document.querySelectorAll('#themeToggle button').forEach(btn=>{
  btn.addEventListener('click', ()=>applyTheme(btn.dataset.theme));
});

initTheme();
render();
</script>
