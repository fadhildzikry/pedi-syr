<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SirupDosis — Kalkulator Sirup Pediatri</title>
<style>
:root {
  --bg:#0b0f10; --sidebar:#0d1315; --panel:#12181a; --panel2:#161e20;
  --line:#1e2c2f; --line2:#243537;
  --text:#e4f0ec; --muted:#607a76; --muted2:#8fb5ae;
  --accent:#3ddc97; --accent-dim:#183d2a; --accent-glow:rgba(61,220,151,0.18);
  --warn:#d4952e; --danger:#d44e30; --info:#4a8fa8;
  --mono:'SF Mono','Cascadia Code',Consolas,monospace;
  --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}

/* ─── DESKTOP APP SHELL ─────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR */
.sidebar{
  width:240px;flex-shrink:0;
  background:var(--sidebar);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.logo{
  padding:18px 16px 14px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.logo h1{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-0.2px;}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex-shrink:0;}
.logo .sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:4px;}

/* WEIGHT */
.weight-sec{padding:14px 14px 12px;border-bottom:1px solid var(--line);flex-shrink:0;}
.wlabel{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.9px;margin-bottom:7px;}
.winput-wrap{
  display:flex;align-items:center;
  background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);
  padding:0 10px;transition:border-color .15s,box-shadow .15s;
}
.winput-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.winput-wrap input{
  flex:1;background:transparent;border:none;
  color:var(--text);font-size:26px;font-weight:800;font-family:var(--mono);
  padding:9px 6px 9px 0;outline:none;width:100%;
}
.winput-wrap .unit{color:var(--muted2);font-size:13px;font-weight:700;font-family:var(--mono);}
.quickset{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;}
.quickset button{
  background:var(--panel2);border:1px solid var(--line2);color:var(--muted);
  font-size:10.5px;font-family:var(--mono);font-weight:700;padding:4px 8px;border-radius:6px;
  cursor:pointer;transition:all .12s;
}
.quickset button:hover{border-color:var(--muted2);color:var(--muted2);}
.quickset button.active{background:var(--accent-dim);color:#aaedcf;border-color:var(--accent);}

/* TABS */
.tab-nav{
  flex:1;overflow-y:auto;padding:8px;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
}
.tab-nav::-webkit-scrollbar{width:3px;}
.tab-nav::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px;}
.tab-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--muted2);
  transition:all .12s;margin-bottom:2px;
}
.tab-item:hover{background:var(--panel);color:var(--text);}
.tab-item.active{background:var(--accent-dim);color:#c5f0db;}
.tab-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.tab-label{flex:1;}
.tab-count{
  font-size:10px;font-family:var(--mono);
  background:var(--panel);color:var(--muted);
  padding:2px 6px;border-radius:8px;
}
.tab-item.active .tab-count{background:rgba(0,0,0,.25);color:#8de8bc;}

/* MAIN */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}

.content-header{
  padding:16px 24px 12px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  flex-shrink:0;
  background:rgba(11,15,16,.96);backdrop-filter:blur(8px);
}
.content-title{font-size:17px;font-weight:700;}
.content-meta{font-size:11px;color:var(--muted);font-family:var(--mono);}

.ref-strip{
  display:flex;gap:18px;flex-wrap:wrap;
  padding:7px 24px;
  background:var(--panel);border-bottom:1px solid var(--line);
  font-size:10px;color:var(--muted);font-family:var(--mono);
  flex-shrink:0;
}
.ref-strip b{color:var(--muted2);}
.ref-warn{color:var(--warn);}

.cards-scroll{flex:1;overflow-y:auto;padding:18px 20px 40px;}

/* GRID: 2-col on desktop, 1-col on narrow */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  align-items:start;
}

/* DRUG CARD */
.drug-card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px;display:flex;flex-direction:column;gap:9px;
}
.drug-head{}
.drug-name{font-size:13.5px;font-weight:700;line-height:1.3;color:var(--text);}
.drug-brands{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.4;}

.conc-toggle{display:flex;gap:4px;flex-wrap:wrap;}
.conc-toggle button{
  font-size:9.5px;font-family:var(--mono);font-weight:700;
  padding:4px 7px;border-radius:5px;
  background:var(--panel2);color:var(--muted);border:1px solid var(--line2);cursor:pointer;
  transition:all .12s;
}
.conc-toggle button.active{background:var(--accent-dim);color:#c5f0db;border-color:var(--accent);}

.dose-target{
  font-size:9.5px;color:var(--muted);font-family:var(--mono);
  line-height:1.5;padding:5px 8px;background:var(--panel2);border-radius:6px;
}

/* THE HERO */
.result-row{
  background:var(--panel2);border-radius:10px;
  padding:11px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1px solid transparent;
}
.result-row.flag{border-color:var(--danger);}
.result-left{display:flex;flex-direction:column;gap:2px;}
.result-label{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.result-band{font-size:10.5px;color:var(--muted2);}
.result-mg{font-size:10px;color:var(--muted);font-family:var(--mono);}
.result-right{text-align:right;flex-shrink:0;}
.result-cth{
  font-size:28px;font-weight:900;font-family:var(--mono);
  color:var(--accent);line-height:1;
  text-shadow:0 0 24px rgba(61,220,151,.28);
}
.result-ml{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px;}

.result-placeholder{
  font-size:11px;color:var(--muted);font-style:italic;
  padding:8px;text-align:center;
}
.freq-badge{
  display:inline-block;font-size:10px;color:var(--muted2);
  background:rgba(255,255,255,.03);border:1px solid var(--line);
  padding:4px 8px;border-radius:6px;line-height:1.4;
}

.note-strip{
  font-size:10px;line-height:1.55;
  padding:7px 10px;border-radius:0 6px 6px 0;
  border-left:2px solid var(--warn);
  background:rgba(212,149,46,.07);color:var(--warn);
}
.note-strip.danger{border-color:var(--danger);background:rgba(212,78,48,.07);color:var(--danger);}
.note-strip.info{border-color:var(--info);background:rgba(74,143,168,.07);color:#7bc4d8;}

/* ─── MOBILE ─────────────────────────────────── */
@media(max-width:768px){
  .app{flex-direction:column;height:auto;min-height:100vh;}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);}
  .logo{padding:12px 14px 10px;}
  .weight-sec{padding:12px 14px 10px;}
  .winput-wrap input{font-size:22px;}
  .tab-nav{
    display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;
    padding:8px;gap:5px;flex:none;scrollbar-width:none;
  }
  .tab-nav::-webkit-scrollbar{display:none;}
  .tab-item{flex-shrink:0;padding:7px 12px;border-radius:20px;margin-bottom:0;font-size:12px;white-space:nowrap;}
  .tab-icon,.tab-count{display:none;}
  .main-content{overflow:visible;}
  .cards-scroll{overflow:visible;padding:12px 12px 32px;}
  .cards-grid{grid-template-columns:1fr;}
  .result-cth{font-size:24px;}
  .content-header{padding:12px 14px 10px;}
  .ref-strip{padding:6px 14px;gap:12px;}
}
</style>
</head>

let currentWeight = null;
let activeTab = "analgesik";
let activeConc = {};

function fmtFraction(mL) {
  const cth = mL / 5;
  if (cth <= 0) return null;
  const fracs = [
    [1/4,"¼ cth"],[1/3,"⅓ cth"],[1/2,"½ cth"],[2/3,"⅔ cth"],[3/4,"¾ cth"],
    [1,"1 cth"],[1.25,"1¼ cth"],[1.5,"1½ cth"],[1.75,"1¾ cth"],[2,"2 cth"],
    [2.5,"2½ cth"],[3,"3 cth"],[3.5,"3½ cth"],[4,"4 cth"]
  ];
  let best = null, bestDiff = 999;
  for (const [v, label] of fracs) {
    const diff = Math.abs(v - cth);
    if (diff < bestDiff) { bestDiff = diff; best = label; }
  }
  return bestDiff > 0.18 ? cth.toFixed(2) + " cth" : best;
}

function calcDrug(drug, weight) {
  if (drug.skipCalc) return null;
  const concIdx = activeConc[drug.id] ?? drug.concs.findIndex(c => c.default);
  const conc = drug.concs[concIdx];
  if (drug.fixedByAge) {
    const band = drug.bands && drug.bands.find(b => weight >= b.minKg && weight < b.maxKg);
    if (!band) return null;
    return { mL: band.mL, cthLabel: fmtFraction(band.mL), bandText: band.text, mgLow: null, mgHigh: null, conc };
  }
  let mgLow, mgHigh;
  if (drug.trimethoprimBasis) {
    mgLow = mgHigh = drug.mgPerKgLowDay * weight / drug.dividedBy;
  } else if (drug.mgPerKgLowDay !== undefined) {
    mgLow = (drug.mgPerKgLowDay * weight) / drug.dividedBy;
    mgHigh = (drug.mgPerKgHighDay * weight) / drug.dividedBy;
  } else {
    mgLow = drug.mgPerKgLow * weight;
    mgHigh = drug.mgPerKgHigh * weight;
  }
  if (drug.maxSingleMg) { mgLow = Math.min(mgLow, drug.maxSingleMg); mgHigh = Math.min(mgHigh, drug.maxSingleMg); }
  const mLLow = (mgLow / conc.mgPer5) * 5;
  const mLHigh = (mgHigh / conc.mgPer5) * 5;
  const mLMid = (mLLow + mLHigh) / 2;
  return { mL: mLMid, mLLow, mLHigh, cthLabel: fmtFraction(mLMid), mgLow, mgHigh, conc };
}

function renderTabNav() {
  const nav = document.getElementById('tabNav');
  nav.innerHTML = '';
  Object.entries(DB).forEach(([key, cat]) => {
    const item = document.createElement('div');
    item.className = 'tab-item' + (key === activeTab ? ' active' : '');
    item.innerHTML = `<span class="tab-icon">${TAB_ICONS[key]||'💊'}</span>
      <span class="tab-label">${cat.label}</span>
      <span class="tab-count">${cat.drugs.length}</span>`;
    item.onclick = () => { activeTab = key; render(); };
    nav.appendChild(item);
  });
}

function renderQuickset() {
  const qs = document.getElementById('quickset');
  const presets = [5,6,8,10,12,15,18,20,25,30];
  qs.innerHTML = '';
  presets.forEach(w => {
    const b = document.createElement('button');
    b.textContent = w + 'kg';
    b.className = currentWeight === w ? 'active' : '';
    b.onclick = () => { currentWeight = w; document.getElementById('weightInput').value = w; render(); };
    qs.appendChild(b);
  });
}

function buildCard(drug) {
  const card = document.createElement('div');
  card.className = 'drug-card';
  let html = `<div class="drug-head">
    <div class="drug-name">${drug.name}</div>
    <div class="drug-brands">${drug.brands}</div>
  </div>`;

  if (drug.skipCalc) {
    const cls = drug.name.includes('⚠') || drug.note.startsWith('⚠') ? 'danger' : 'info';
    html += `<div class="note-strip ${cls}">${drug.note}</div>`;
    card.innerHTML = html; return card;
  }

  if (drug.concs && drug.concs.length > 1) {
    html += `<div class="conc-toggle">`;
    drug.concs.forEach((c, i) => {
      const active = (activeConc[drug.id] ?? drug.concs.findIndex(x => x.default)) === i;
      html += `<button data-drug="${drug.id}" data-idx="${i}" class="${active?'active':''}">${c.label}</button>`;
    });
    html += `</div>`;
  }

  const result = currentWeight ? calcDrug(drug, currentWeight) : null;

  if (!currentWeight) {
    html += `<div class="result-placeholder">Masukkan BB untuk melihat dosis</div>`;
  } else if (!result) {
    html += `<div class="note-strip danger">Berat di luar rentang dosis yang tersedia.</div>`;
  } else {
    const targetText = drug.fixedByAge
      ? `Dosis pita berat/usia · ${result.conc.label}`
      : drug.trimethoprimBasis
        ? `${drug.mgPerKgLowDay} mg/kg/hr TMP ÷${drug.dividedBy}x · ${result.conc.label}`
        : drug.mgPerKgLowDay !== undefined
          ? `${drug.mgPerKgLowDay}–${drug.mgPerKgHighDay} mg/kg/hr ÷${drug.dividedBy}x · ${result.conc.label}`
          : `${drug.mgPerKgLow}–${drug.mgPerKgHigh} mg/kg/dosis · ${result.conc.label}`;
    html += `<div class="dose-target">${targetText}</div>`;

    const lowFlag = drug.minWeight && currentWeight < drug.minWeight;
    const mgRange = result.mgLow != null
      ? `${result.mgLow.toFixed(0)}–${result.mgHigh.toFixed(0)} mg · ${result.mLLow.toFixed(1)}–${result.mLHigh.toFixed(1)} mL`
      : '';
    html += `<div class="result-row${lowFlag?' flag':''}">
      <div class="result-left">
        <div class="result-label">Per dosis</div>
        ${result.bandText ? `<div class="result-band">${result.bandText}</div>` : ''}
        ${mgRange ? `<div class="result-mg">${mgRange}</div>` : ''}
      </div>
      <div class="result-right">
        <div class="result-cth">${result.cthLabel}</div>
        <div class="result-ml">${result.mL.toFixed(2)} mL</div>
      </div>
    </div>`;

    html += `<div class="freq-badge">${drug.freq}</div>`;
    if (lowFlag) html += `<div class="note-strip danger">BB &lt; ${drug.minWeight}kg — verifikasi indikasi.</div>`;
  }

  if (drug.note) html += `<div class="note-strip">${drug.note}</div>`;

  card.innerHTML = html;
  card.querySelectorAll('.conc-toggle button').forEach(btn => {
    btn.onclick = () => { activeConc[btn.dataset.drug] = parseInt(btn.dataset.idx); renderCards(); };
  });
  return card;
}

function renderCards() {
  const area = document.getElementById('cardsArea');
  const cat = DB[activeTab];
  document.getElementById('contentTitle').textContent = cat.label;
  document.getElementById('contentMeta').textContent =
    (currentWeight ? `BB ${currentWeight} kg · ` : '') + `${cat.drugs.length} obat`;

  const grid = document.createElement('div');
  grid.className = 'cards-grid';
  cat.drugs.forEach(drug => grid.appendChild(buildCard(drug)));

  area.innerHTML = '';
  area.appendChild(grid);
}

function render() { renderTabNav(); renderQuickset(); renderCards(); }

document.getElementById('weightInput').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  currentWeight = isNaN(v) || v <= 0 ? null : v;
  renderQuickset();
  renderCards();
});

render();

</script>
</body>
</html>
